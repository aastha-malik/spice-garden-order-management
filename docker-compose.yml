services:
  db:
    image: postgres:16-alpine
    container_name: spice_garden_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: spice
      POSTGRES_PASSWORD: spice
      POSTGRES_DB: spice_garden
    ports:
      # Host 5433 to avoid clashing with a local Postgres on 5432.
      - "5433:5432"
    volumes:
      - spice_garden_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spice -d spice_garden"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  spice_garden_data:
